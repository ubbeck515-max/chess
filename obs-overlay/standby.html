<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>대기 화면</title>
<style>
  :root {
    --sky-top: #16323a;
    --sky-mid: #2b5a5d;
    --sky-low: #6f9e9a;
    --snow: #dfeae6;
    --ink: #12252a;
    --card: #14262a;
    --line: #6e9b96;
    --fg: #e4f0ed;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--sky-top); }
  body {
    font-family: "Pretendard", "Malgun Gothic", -apple-system, sans-serif;
    color: var(--fg);
  }

  /* 하늘 */
  #sky {
    position: fixed; inset: 0;
    background:
      radial-gradient(900px 500px at 78% 18%, rgba(224,240,236,.22), transparent 70%),
      linear-gradient(#16323a 0%, #244a4e 45%, #3d6d6c 72%, #6f9e9a 100%);
  }
  /* 달 */
  #moon {
    position: fixed; right: 16%; top: 12%;
    width: 120px; height: 120px; border-radius: 50%;
    background: #eaf4f0;
    box-shadow: 0 0 60px 18px rgba(234,244,240,.28);
  }

  canvas { position: fixed; inset: 0; }

  /* 가운데 문구 */
  #card {
    position: fixed; left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    min-width: 720px; padding: 54px 72px;
    text-align: center;
    background: rgba(20, 38, 42, .78);
    border: 2px solid var(--line);
    border-radius: 18px;
    backdrop-filter: blur(3px);
  }
  #title { font-size: 64px; font-weight: 800; letter-spacing: -.02em; }
  #subtitle { margin-top: 16px; font-size: 26px; color: #b7d2cc; font-weight: 500; }
  #dots { margin-top: 26px; display: flex; gap: 10px; justify-content: center; }
  #dots i {
    width: 10px; height: 10px; border-radius: 50%; background: var(--line);
    animation: pulse 1.4s infinite ease-in-out;
  }
  #dots i:nth-child(2) { animation-delay: .2s; }
  #dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: .3 } 40% { opacity: 1 } }

  /* 설표 그림을 놓을 자리 (있으면 보이고 없으면 비어 있음) */
  #art { position: fixed; right: 4%; bottom: 0; max-height: 62%; max-width: 40%; }
</style>
</head>
<body>
<div id="sky"></div>
<div id="moon"></div>
<canvas id="back"></canvas>

<div id="card">
  <div id="title">잠시 후 돌아옵니다</div>
  <div id="subtitle">Be right back</div>
  <div id="dots"><i></i><i></i><i></i></div>
</div>

<img id="art" alt="" hidden />
<canvas id="front"></canvas>

<script>
/*
 * OBS 브라우저 소스용 대기 화면.
 *
 *   standby.html?title=...&subtitle=...&art=<설표 그림 주소>
 *
 * 눈은 앞뒤 두 겹으로 내린다. 뒤쪽은 작고 느리게, 앞쪽은 크고 빠르게 떨어뜨려
 * 깊이가 생기게 했다. 문구 카드는 그 사이에 놓여서 눈이 뒤로도 앞으로도 지나간다.
 */
const params = new URLSearchParams(location.search);
if (params.get("title")) document.getElementById("title").textContent = params.get("title");
if (params.get("subtitle")) document.getElementById("subtitle").textContent = params.get("subtitle");
if (params.get("art")) {
  const art = document.getElementById("art");
  art.src = params.get("art");
  art.hidden = false;
}

/* ---------- 눈 ---------- */
function snowfall(canvas, { count, size, speed, drift, alpha }) {
  const ctx = canvas.getContext("2d");
  let flakes = [];

  function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    flakes = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: size.min + Math.random() * (size.max - size.min),
      vy: speed.min + Math.random() * (speed.max - speed.min),
      /* 좌우로 흔들리는 위상 */
      phase: Math.random() * Math.PI * 2,
      sway: drift * (0.5 + Math.random()),
    }));
  }
  resize();
  addEventListener("resize", resize);

  let t = 0;
  (function frame() {
    t += 0.01;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = `rgba(233, 243, 240, ${alpha})`;
    for (const f of flakes) {
      f.y += f.vy;
      const x = f.x + Math.sin(t * 1.6 + f.phase) * f.sway;
      if (f.y - f.r > canvas.height) {
        f.y = -f.r;
        f.x = Math.random() * canvas.width;
      }
      ctx.beginPath();
      ctx.arc(x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  })();
}

snowfall(document.getElementById("back"),
  { count: 110, size: { min: 1, max: 2.4 }, speed: { min: .25, max: .7 }, drift: 14, alpha: .5 });
snowfall(document.getElementById("front"),
  { count: 55, size: { min: 2.5, max: 5 }, speed: { min: .9, max: 1.8 }, drift: 26, alpha: .85 });

/* ---------- 눈 쌓인 능선 ---------- */
(function ridges() {
  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none"
       style="position:fixed;inset:0;width:100%;height:100%">
    <path d="M0,760 L260,560 L420,700 L640,470 L900,760 L1150,600 L1380,740 L1650,520 L1920,780 L1920,1080 L0,1080 Z"
          fill="#20434a" opacity=".85"/>
    <path d="M0,880 L300,720 L560,860 L820,690 L1080,880 L1340,770 L1600,900 L1920,760 L1920,1080 L0,1080 Z"
          fill="#2d5c5c" opacity=".9"/>
    <path d="M0,990 L280,930 L620,1000 L960,920 L1320,1000 L1660,930 L1920,990 L1920,1080 L0,1080 Z"
          fill="#dfeae6"/>
  </svg>`;
  document.getElementById("sky").insertAdjacentHTML("afterend", svg);
})();
</script>
</body>
</html>
